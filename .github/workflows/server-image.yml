name: Server image

on:
  push:
    branches:
      - main
    paths:
      - site/Dockerfile
      - cmd/server/**
      - extractor/**
      - lang/**
      - "!lang/**/*_test.go"
      - "!lang/THIRD_PARTY.md"
      - postag/**
      - "!postag/**/*_test.go"
      - "!postag/models/**"
      - rarity/**/*.go
      - "!rarity/**/*_test.go"
      - go.mod
      - go.sum

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: site/Dockerfile
          push: true
          tags: |
            ghcr.io/tericcabrel/keyphrase/server:latest
            ghcr.io/tericcabrel/keyphrase/server:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
