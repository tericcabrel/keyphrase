name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    env:
      # The toolchain line would otherwise download go1.27.1 inside the 1.26 job.
      GOTOOLCHAIN: ${{ matrix.go-version == '1.26.x' && 'local' || 'auto' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Test
        run: gotestsum -- ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          # 1.27.2 writes export data v5, which golangci-lint v2.13.2 cannot read.
          go-version: "1.27.1"
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
