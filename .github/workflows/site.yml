name: Site

on:
  pull_request:
    branches:
      - main
    paths: &website
      - site/public/**
      - site/functions/**
      - "!site/functions/**/*.test.mjs"
      - site/wrangler.toml
      - site/package.json
      - site/yarn.lock
      - site/.yarnrc.yml
      - cmd/sitewasm/**
      - extractor/**
      - "!extractor/**/*_test.go"
      - lang/**
      - "!lang/**/*_test.go"
      - "!lang/THIRD_PARTY.md"
      - postag/**
      - "!postag/**/*_test.go"
      - "!postag/models/**"
      - rarity/**/*.go
      - "!rarity/**/*_test.go"
      - go.mod
      - go.sum
  push:
    branches:
      - main
    paths: *website

permissions:
  contents: read
  deployments: write

concurrency:
  group: site-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: deploy
    # A fork pull request cannot read the Cloudflare secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.0 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the site
        run: just site-build

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install site dependencies
        working-directory: site
        run: |
          corepack enable
          yarn install --immutable

      - name: Test the site
        working-directory: site
        run: yarn test

      # A first deploy that creates the project would take the current branch
      # as production. Create it on main first, including from a preview.
      - name: Create the Pages project
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list=$(yarn wrangler pages project list)
          if printf '%s\n' "$list" | grep -Eq '(^|[[:space:]|])keyphrase([[:space:]|]|$)'; then
            echo "Pages project keyphrase already exists"
          else
            yarn wrangler pages project create keyphrase --production-branch main
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: yarn
          wranglerVersion: "4.148.0"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy --project-name=keyphrase --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }} --commit-hash=${{ github.sha }}
